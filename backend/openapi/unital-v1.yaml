openapi: 3.1.0
info:
  title: Unital API
  version: 1.0.0
  description: |
    Building & complex management platform. Consolidated gateway API for the
    Unital Go microservices (identity, property, billing, facilities,
    operations, notifications/communications).

    **Auth**: `POST /auth/login` returns an access token (15 min) + refresh
    token. Send `Authorization: Bearer <access>` on every other call.

    **Errors**: all failures use RFC 9457 problem details with a
    machine-readable `code` and `trace_id`.
  contact: { name: Unital, url: https://unital.app }
servers:
  - url: http://localhost:8080/api/v1
    description: local gateway
  - url: http://localhost:18080/api/v1
    description: local gateway (dev port)
tags:
  - { name: Auth, description: Registration, login, tokens, profile }
  - { name: Memberships, description: Building roles & access }
  - { name: Property, description: Buildings, units, assets, contracts }
  - { name: Billing, description: Charges, payments, invoices, reports }
  - { name: Notifications, description: Campaigns, templates, inbox }
  - { name: Facilities, description: Amenities, bookings, maintenance }
  - { name: Operations, description: Teams, tasks, service requests }
  - { name: Comms, description: Announcements, meetings, support tickets }

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            example:
              email: sara@example.com
              password: secret12
              full_name: سارا احمدی
              phone: "09120000001"
              role: owner
      responses:
        "201":
          description: Account created (unverified — login requires /auth/verify)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: Logged out }

  /auth/verify:
    post:
      tags: [Auth]
      summary: Verify account with emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Verified }
        "401": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      tags: [Auth]
      summary: My profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [Auth]
      summary: Update my profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone: { type: string }
                national_code: { type: string }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /me/buildings:
    get:
      tags: [Memberships]
      summary: Buildings I belong to (with my role)
      responses:
        "200":
          description: Membership list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }

  /buildings/{buildingID}/memberships:
    parameters:
      - $ref: "#/components/parameters/BuildingID"
    post:
      tags: [Memberships]
      summary: Grant a building role (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string }
                role:
                  type: string
                  enum: [manager, board_member, staff, owner, resident]
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Problem" }
    get:
      tags: [Memberships]
      summary: List building memberships (members only)
      responses:
        "200":
          description: Membership list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }

  /buildings/{buildingID}/memberships/{membershipID}:
    delete:
      tags: [Memberships]
      summary: Revoke a membership (manager only)
      parameters:
        - $ref: "#/components/parameters/BuildingID"
        - name: membershipID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked }
        "403": { $ref: "#/components/responses/Problem" }

  # ---------------- Property ----------------

  /buildings:
    post:
      tags: [Property]
      summary: Create a building
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildingInput" }
            example:
              name: برج‌های یونیتال
              code: TWR-1
              type: residential
              address: تهران، خیابان نمونه
              floors: 10
              features: [billing, notifications]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [Property]
      summary: List my buildings
      responses:
        "200":
          description: Buildings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Building" }

  /buildings/{buildingID}:
    parameters:
      - $ref: "#/components/parameters/BuildingID"
    get:
      tags: [Property]
      summary: Building detail
      responses:
        "200":
          description: Building
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Property]
      summary: Update a building (manager/board)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildingInput" }
      responses:
        "200": { description: Updated building }
        "403": { $ref: "#/components/responses/Problem" }

  /buildings/{buildingID}/units:
    parameters:
      - $ref: "#/components/parameters/BuildingID"
    get:
      tags: [Property]
      summary: List units (building members)
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Unit" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Property]
      summary: Create a unit (manager/board)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /units/{unitID}:
    get:
      tags: [Property]
      summary: Unit detail
      parameters:
        - name: unitID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
    patch:
      tags: [Property]
      summary: Update a unit — status/rooms/area (manager/board)
      parameters:
        - name: unitID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [occupied, vacant, under_construction] }
                area_m2: { type: number }
                rooms: { type: integer }
      responses:
        "200": { description: Updated unit }
        "403": { $ref: "#/components/responses/Problem" }

  /units/{unitID}/parties:
    get:
      tags: [Property]
      summary: Current owner/resident + validity-ranged history
      parameters:
        - name: unitID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Parties
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitParties" }

  /units/{unitID}/transfer-history:
    get:
      tags: [Property]
      summary: Audited ownership/residency changes
      parameters:
        - name: unitID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transfer records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TransferRecord" }

  /units/{unitID}/ownership-changes:
    post:
      tags: [Property]
      summary: Record an ownership change (manager)
      parameters:
        - name: unitID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartyChangeInput" }
      responses:
        "200": { description: Owner changed (history recorded) }
        "403": { $ref: "#/components/responses/Problem" }

  /units/{unitID}/residency-changes:
    post:
      tags: [Property]
      summary: Record a residency change (manager)
      parameters:
        - name: unitID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartyChangeInput" }
      responses:
        "200": { description: Resident changed (history recorded) }
        "403": { $ref: "#/components/responses/Problem" }

  /buildings/{buildingID}/assets:
    parameters:
      - $ref: "#/components/parameters/BuildingID"
    get:
      tags: [Property]
      summary: List parkings/warehouses (kind required)
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [parking, warehouse] }
        - name: status
          in: query
          schema: { type: string, enum: [available] }
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Asset" }
    post:
      tags: [Property]
      summary: Create a parking/warehouse (manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }

  /units/{unitID}/assets:
    post:
      tags: [Property]
      summary: Assign an asset to a unit (same-building rule enforced)
      parameters:
        - name: unitID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, code]
              properties:
                kind: { type: string, enum: [parking, warehouse] }
                code: { type: string, example: P-01 }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "409": { $ref: "#/components/responses/Problem" }

  /units/{unitID}/assets/{assetCode}:
    delete:
      tags: [Property]
      summary: Release an asset from a unit (manager)
      parameters:
        - name: unitID
          in: path
          required: true
          schema: { type: string }
        - name: assetCode
          in: path
          required: true
          schema: { type: string }
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [parking, warehouse] }
      responses:
        "200": { description: Released }

  /contracts:
    post:
      tags: [Property]
      summary: Draft a contract (purchase/rental/transfer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractInput" }
      responses:
        "201":
          description: Draft created (number auto-generated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }

  /contracts/{contractID}:
    get:
      tags: [Property]
      summary: Contract detail
      parameters:
        - name: contractID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }

  /contracts/{contractID}/sign:
    post:
      tags: [Property]
      summary: Sign as first or second party (caller must be a party)
      parameters:
        - name: contractID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Signed }
        "422": { $ref: "#/components/responses/Problem" }

  /contracts/{contractID}/activate:
    post:
      tags: [Property]
      summary: |
        Activate a fully-signed draft. Side effects: purchase → ownership
        transfer, rental → residency transfer; emits contract.activated.
      parameters:
        - name: contractID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------- Billing ----------------

  /buildings/{buildingID}/charge-templates:
    parameters:
      - $ref: "#/components/parameters/BuildingID"
    post:
      tags: [Billing]
      summary: Define a recurring charge (manager/board)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeTemplateInput" }
      responses:
        "201": { description: Template created }
    get:
      tags: [Billing]
      summary: List charge templates (members)
      responses:
        "200": { description: Templates }

  /buildings/{buildingID}/charges:generate:
    post:
      tags: [Billing]
      summary: Generate charges for a period (idempotent per unit×template×period)
      parameters:
        - $ref: "#/components/parameters/BuildingID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: "1405-06", description: Jalali YYYY-MM }
                due_in_days: { type: integer, default: 14 }
      responses:
        "200":
          description: Generation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  period: { type: string }
        "403": { $ref: "#/components/responses/Problem" }

  /buildings/{buildingID}/charges:
    parameters:
      - $ref: "#/components/parameters/BuildingID"
    get:
      tags: [Billing]
      summary: List charges (filterable)
      parameters:
        - { name: unit_id, in: query, schema: { type: string } }
        - { name: period, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ChargeStatus" } }
      responses:
        "200":
          description: Charges
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Charge" }

  /charges/{chargeID}/payments:
    post:
      tags: [Billing]
      summary: Record a payment attempt (creates a pending transaction)
    parameters:
      - name: chargeID
        in: path
        required: true
        schema: { type: string }
    requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: integer, format: int64, description: Rial }
                method: { type: string, enum: [online, cash, bank_transfer, cheque, pos] }
    responses:
        "201": { description: Transaction created }

  /transactions/{txID}/confirm:
    post:
      tags: [Billing]
      summary: Confirm a transaction (manager; applies to charge + invoice)
      parameters:
        - name: txID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Confirmed }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /buildings/{buildingID}/invoices:
    get:
      tags: [Billing]
      summary: Per-unit period invoices
      parameters:
        - $ref: "#/components/parameters/BuildingID"
        - { name: unit_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Invoices }

  /buildings/{buildingID}/reports/financial:
    get:
      tags: [Billing]
      summary: Collections report for a period (manager/board)
      parameters:
        - $ref: "#/components/parameters/BuildingID"
        - { name: period, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  period: { type: string }
                  units: { type: integer }
                  total_billed: { type: integer, format: int64 }
                  total_collected: { type: integer, format: int64 }
                  outstanding: { type: integer, format: int64 }
                  overdue_count: { type: integer }
                  collection_rate: { type: number }

  # ---------------- Notifications ----------------

  /templates:
    get:
      tags: [Notifications]
      summary: List notification templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationTemplate" }
    post:
      tags: [Notifications]
      summary: Create/update a template (per-channel variants)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplate" }
      responses:
        "200": { description: Upserted }

  /notifications:send:
    post:
      tags: [Notifications]
      summary: Send a campaign (fan-out to recipients × channels)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [building_id, template, target]
              properties:
                building_id: { type: string }
                template: { type: string, example: charge.overdue.reminder }
                target: { $ref: "#/components/schemas/NotificationTarget" }
                vars:
                  type: object
                  additionalProperties: { type: string }
                  example: { period: "1405-06", remaining: "1500000" }
                channels:
                  type: array
                  items: { type: string, enum: [inapp, email, sms, webhook] }
                schedule_at: { type: string, format: date-time }
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /notifications/{campaignID}:
    get:
      tags: [Notifications]
      summary: Campaign status + per-channel counters + deliveries
      parameters:
        - name: campaignID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Campaign detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign: { $ref: "#/components/schemas/Campaign" }
                  counters:
                    type: object
                    properties:
                      pending: { type: integer }
                      sent: { type: integer }
                      failed: { type: integer }
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/Delivery" }

  /me/notifications:
    get:
      tags: [Notifications]
      summary: My inbox
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Inbox messages (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InboxMessage" }

  /me/notifications/{messageID}/read:
    post:
      tags: [Notifications]
      summary: Mark an inbox message read
      parameters:
        - name: messageID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Marked read }

  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Request a password-reset email (always 200 — never reveals accounts)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Reset requested if the account exists }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Reset the password with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string }
      responses:
        "200": { description: Password updated }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /charge-templates/{templateID}:
    patch:
      tags: [Billing]
      summary: Update a charge template (manager/board)
      parameters:
        - name: templateID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                amount: { type: integer }
                description: { type: string }
                is_active: { type: boolean }
      responses:
        "200": { description: Updated template }
        "403": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Billing]
      summary: Delete a charge template (manager/board)
      parameters:
        - name: templateID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }

  /facilities:
    post:
      tags: [Facilities]
      summary: Define a facility (manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Facility" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /buildings/{buildingID}/facilities:
    parameters:
      - $ref: "#/components/parameters/BuildingID"
    get:
      tags: [Facilities]
      summary: List the building's facilities (members)
      responses:
        "200":
          description: Facilities
          content:
            application/json:
              schema:
