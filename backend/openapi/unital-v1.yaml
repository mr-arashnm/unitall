                internal: { type: boolean }
      responses:
        "201": { description: Reply added }
        "403": { $ref: "#/components/responses/Problem" }

  /tickets/{ticketID}/resolve:
    post:
      tags: [Comms]
      summary: Resolve a ticket (staff)
      parameters:
        - name: ticketID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Resolved }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /tickets/{ticketID}/close:
    post:
      tags: [Comms]
      summary: Close a ticket (staff)
      parameters:
        - name: ticketID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Closed }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BuildingID:
      name: buildingID
      in: path
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with machine-readable code
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: UNIT_NOT_IN_BUILDING }
        detail: { type: string }
        trace_id: { type: string }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          description: "≥8 chars with a letter and a digit"
        full_name: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [manager, staff, owner, resident, board_member]
          default: resident

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        full_name: { type: string }
        phone: { type: string }
        national_code: { type: string }
        platform_role: { type: string }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    Membership:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        building_id: { type: string }
        role: { type: string, enum: [manager, board_member, staff, owner, resident] }
        from: { type: string, format: date-time }

    BuildingInput:
      type: object
      required: [name, code, type, address]
      properties:
        name: { type: string }
        code: { type: string, example: TWR-1 }
        type: { type: string, enum: [residential, commercial, office, mixed] }
        address: { type: string }
        floors: { type: integer }
        features:
          type: array
          items: { type: string }

    Building:
      allOf:
        - $ref: "#/components/schemas/BuildingInput"
        - type: object
          properties:
            id: { type: string }
            created_by: { type: string }
            created_at: { type: string, format: date-time }

    UnitInput:
      type: object
      required: [floor, number]
      properties:
        floor: { type: integer }
        number: { type: string, example: "301" }
        area_m2: { type: number }
        rooms: { type: integer }

    Unit:
      allOf:
        - $ref: "#/components/schemas/UnitInput"
        - type: object
          properties:
            id: { type: string }
            building_id: { type: string }
            status: { type: string, enum: [occupied, vacant, under_construction] }
            created_at: { type: string, format: date-time }

    UnitParties:
      type: object
      properties:
        current:
          type: object
          properties:
            owner: { $ref: "#/components/schemas/Party" }
            resident: { $ref: "#/components/schemas/Party" }
        history:
          type: array
          items: { $ref: "#/components/schemas/Party" }

    Party:
      type: object
      properties:
        user_id: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, nullable: true }

    PartyChangeInput:
      type: object
      required: [new_user_id]
      properties:
        new_user_id: { type: string }
        effective_date: { type: string, format: date, example: "2026-09-01" }
        contract_number: { type: string }
        description: { type: string }

    TransferRecord:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [owner, resident] }
        previous_user_id: { type: string }
        new_user_id: { type: string }
        effective_date: { type: string, format: date }
        contract_number: { type: string }
        recorded_by: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }

    AssetInput:
      type: object
      required: [kind, code]
      properties:
        kind: { type: string, enum: [parking, warehouse] }
        code: { type: string, example: P-01 }
        floor: { type: integer }
        area_m2: { type: number }

    Asset:
      allOf:
        - $ref: "#/components/schemas/AssetInput"
        - type: object
          properties:
            id: { type: string }
            building_id: { type: string }
            unit_id: { type: string, nullable: true }
            available: { type: boolean }

    ContractInput:
      type: object
      required: [type, unit_id, first_party_id, second_party_id, amount]
      properties:
        type: { type: string, enum: [purchase, rental, transfer] }
        unit_id: { type: string }
        first_party_id: { type: string }
        second_party_id: { type: string }
        title: { type: string }
        amount: { type: integer, format: int64, description: Rial }
        deposit_amount: { type: integer, format: int64 }
        start_date: { type: string, format: date }
        duration_months: { type: integer }

    Contract:
      allOf:
        - $ref: "#/components/schemas/ContractInput"
        - type: object
          properties:
            id: { type: string }
            number: { type: string, example: CONTRACT-20260823-0001 }
            status: { type: string, enum: [draft, active, expired, cancelled] }
            first_signed: { type: boolean }
            second_signed: { type: boolean }
            signed_date: { type: string, format: date, nullable: true }

    ChargeStatus:
      type: string
      enum: [pending, paid, partially_paid, overdue, cancelled]

    ChargeTemplateInput:
      type: object
      required: [name, amount]
      properties:
        name: { type: string, example: شارژ ماهانه }
        type:
          type: string
          enum: [monthly, maintenance, elevator, cleaning, security, green_space, pool, gym, other]
        amount: { type: integer, format: int64, description: Rial }
        description: { type: string }

    Charge:
      type: object
      properties:
        id: { type: string }
        unit_id: { type: string }
        template_id: { type: string }
        period: { type: string, example: "1405-06" }
        amount: { type: integer, format: int64 }
        paid: { type: integer, format: int64 }
        remaining: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/ChargeStatus" }
        due_date: { type: string, format: date }

    NotificationTemplate:
      type: object
      required: [name, variants]
      properties:
        name: { type: string, example: charge.overdue.reminder }
        severity: { type: string, enum: [normal, urgent] }
        channels:
          type: array
          items: { type: string, enum: [inapp, email, sms, webhook] }
        variants:
          type: object
          additionalProperties:
            type: object
            properties:
              title: { type: string }
              body: { type: string, description: "Supports {{var}} placeholders" }

    NotificationTarget:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [all, role, users, units] }
        values:
          type: array
          items: { type: string }
          description: "role names / user ids / unit ids (per kind)"

    Campaign:
      type: object
      properties:
        id: { type: string }
        building_id: { type: string }
        template: { type: string }
        target: { $ref: "#/components/schemas/NotificationTarget" }
        vars:
          type: object
          additionalProperties: { type: string }
        channels:
          type: array
          items: { type: string }
        severity: { type: string, enum: [normal, urgent] }
        schedule_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [scheduled, sending, done] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    Delivery:
      type: object
      properties:
        id: { type: string }
        campaign_id: { type: string }
        recipient_id: { type: string }
        channel: { type: string }
        to: { type: string }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        next_retry_at: { type: string, format: date-time }
        provider_ref: { type: string }
        last_error: { type: string }
        sent_at: { type: string, format: date-time, nullable: true }

    InboxMessage:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        campaign_id: { type: string }
        created_at: { type: string, format: date-time }
    FacilityInput:
      type: object
      required: [building_id, name, capacity]
      properties:
        building_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [pool, gym, roof_garden, meeting_room, party_hall, guest_parking, playground, sports_court, library, business_center, other] }
        description: { type: string }
        capacity: { type: integer, minimum: 1 }
        opening_time: { type: string, example: "08:00" }
        closing_time: { type: string, example: "22:00" }
        hourly_rate: { type: integer, description: Rials per hour (0 = free) }
        min_advance_hours: { type: integer, default: 1 }
        max_advance_hours: { type: integer, default: 168 }
        rules: { type: array, items: { type: string } }
        images: { type: array, items: { type: string } }

    Facility:
      allOf:
        - $ref: "#/components/schemas/FacilityInput"
        - type: object
          properties:
            id: { type: string }
            is_active: { type: boolean }
            created_at: { type: string, format: date-time }

    BookingInput:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        purpose: { type: string }
        participants: { type: integer, minimum: 1 }

    Booking:
      type: object
      properties:
        id: { type: string }
        facility_id: { type: string }
        building_id: { type: string }
        user_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        purpose: { type: string }
        participants: { type: integer }
        status: { type: string, enum: [pending, confirmed, completed, cancelled, rejected] }
        total_cost: { type: integer }
        approved_by: { type: string }
        created_at: { type: string, format: date-time }

    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { type: string, enum: [security, maintenance, cleaning, landscaping, pool, gym, other] }
        description: { type: string }
        supervisor: { type: string }

    Team:
      allOf:
        - $ref: "#/components/schemas/TeamInput"
        - type: object
          properties:
            id: { type: string }
            building_id: { type: string }
            members: { type: array, items: { type: string } }
            is_active: { type: boolean }
            created_at: { type: string, format: date-time }

    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        due_date: { type: string, format: date-time }
        estimated_hours: { type: integer }
        related_unit: { type: string }

    Task:
      allOf:
        - $ref: "#/components/schemas/TaskInput"
        - type: object
          properties:
            id: { type: string }
            team_id: { type: string }
            building_id: { type: string }
            assigned_to: { type: string }
            status: { type: string, enum: [pending, assigned, in_progress, completed, cancelled, on_hold] }
            actual_hours: { type: integer }
            assigned_at: { type: string, format: date-time }
            started_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }

    TaskComment:
      type: object
      properties:
        id: { type: string }
        task_id: { type: string }
        author: { type: string }
        comment: { type: string }
        created_at: { type: string, format: date-time }

    ServiceRequestInput:
      type: object
      required: [unit_id, title]
      properties:
        unit_id: { type: string }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [maintenance, cleaning, security, complaint, suggestion, other], default: maintenance }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }

    ServiceRequest:
      allOf:
        - $ref: "#/components/schemas/ServiceRequestInput"
        - type: object
          properties:
            id: { type: string }
            building_id: { type: string }
            submitted_by: { type: string }
            status: { type: string, enum: [submitted, under_review, assigned, in_progress, completed, cancelled] }
            assigned_team: { type: string }
            related_task: { type: string }
            submitted_at: { type: string, format: date-time }
            completed_at: { type: string, format: date-time }

    AnnouncementInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        content: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        target: { $ref: "#/components/schemas/NotificationTarget" }
        expires_at: { type: string, format: date-time }

    Announcement:
      allOf:
        - $ref: "#/components/schemas/AnnouncementInput"
        - type: object
          properties:
            id: { type: string }
            building_id: { type: string }
            status: { type: string, enum: [draft, published] }
            publish_at: { type: string, format: date-time }
            delivered_to: { type: integer }
            created_by: { type: string }
            created_at: { type: string, format: date-time }

    MeetingInput:
      type: object
      required: [title, scheduled_at]
      properties:
        title: { type: string }
        type: { type: string, enum: [board, general, committee, emergency], default: general }
        description: { type: string }
        agenda: { type: string }
        scheduled_at: { type: string, format: date-time }
        location: { type: string }
        duration_min: { type: integer, default: 60 }
        target: { $ref: "#/components/schemas/NotificationTarget" }

    Meeting:
      allOf:
        - $ref: "#/components/schemas/MeetingInput"
        - type: object
          properties:
            id: { type: string }
            building_id: { type: string }
            status: { type: string, enum: [scheduled, ongoing, completed, cancelled] }
            created_by: { type: string }
            created_at: { type: string, format: date-time }

    Attendance:
      type: object
      properties:
        id: { type: string }
        meeting_id: { type: string }
        user_id: { type: string }
        status: { type: string, enum: [invited, confirmed, declined, attended, absent] }
        responded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Minute:
      type: object
      required: [content]
      properties:
        id: { type: string }
        meeting_id: { type: string }
        content: { type: string }
        decisions: { type: string }
        action_items: { type: string }
        signed_by: { type: array, items: { type: string } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TicketInput:
      type: object
      required: [unit_id, title]
      properties:
        unit_id: { type: string }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [technical, financial, complaint, suggestion, general], default: general }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }

    Ticket:
      allOf:
        - $ref: "#/components/schemas/TicketInput"
        - type: object
          properties:
            id: { type: string }
            building_id: { type: string }
            submitted_by: { type: string }
            status: { type: string, enum: [open, in_progress, resolved, closed] }
            assigned_to: { type: string }
            team_id: { type: string }
            submitted_at: { type: string, format: date-time }
            resolved_at: { type: string, format: date-time }
            closed_at: { type: string, format: date-time }

    TicketResponse:
      type: object
      properties:
        id: { type: string }
        ticket_id: { type: string }
        author: { type: string }
        message: { type: string }
        internal: { type: boolean }
        created_at: { type: string, format: date-time }
