# Unital resident app: static SPA + API reverse proxy.
# /api is forwarded verbatim to the gateway (it routes by /api/v1/...),
# so the browser talks to one origin — no CORS involved.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → gateway container (service name resolves inside the compose network)
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: every non-file path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
